name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: 类型检查 + 测试（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（含测试文件）
        run: npm run typecheck

      - name: 运行测试
        run: npm test

      - name: 构建
        run: npm run build
